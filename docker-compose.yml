services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dataorbit-dynamo
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/shell/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # LocalStack Community — DynamoDB with provisioned capacity, throttling simulation
  # Endpoint: http://localhost:8001
  localstack:
    image: localstack/localstack:latest
    container_name: dataorbit-localstack
    ports:
      - "8001:4566"
    environment:
      - SERVICES=dynamodb
      - DEBUG=0
      - PERSISTENCE=0
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep '\"dynamodb\"' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
